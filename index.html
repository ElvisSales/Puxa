<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E0E12">
<title>PUXA — baixe do Insta e do Face</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C6F432'/%3E%3Cpath d='M16 7v14M10 15l6 6 6-6M9 26h14' stroke='%230E0E12' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0E0E12; --campo: #17171D; --borda: #2A2A33; --texto: #F2F2F5;
    --suave: #9C9CA8; --apagado: #8A8A96; --acento: #C6F432; --erro: #FF6B6B;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--texto);
    font: 16px/1.5 'Space Grotesk', system-ui, sans-serif;
    display: flex; justify-content: center; padding: 48px 20px 28px;
  }
  main { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 28px; }
  .topo { display: flex; align-items: center; justify-content: space-between; }
  .marca { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 700; letter-spacing: -.03em; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--acento);
    display: flex; align-items: center; justify-content: center; }
  .versao { font: 11px var(--mono); color: var(--apagado); border: 1px solid var(--borda);
    border-radius: 999px; padding: 6px 10px; }
  h1 { margin: 0 0 10px; font-size: clamp(34px, 10vw, 44px); line-height: 1.02; letter-spacing: -.04em; }
  h1 span { color: var(--acento); }
  .sub { margin: 0; color: var(--suave); font-size: 15px; }
  form { display: flex; flex-direction: column; gap: 24px; }
  .rotulo { display: block; font: 11px var(--mono); color: var(--apagado); text-transform: uppercase;
    letter-spacing: .08em; margin-bottom: 8px; }
  .campo { display: flex; gap: 8px; }
  input[type=url] {
    flex: 1; min-width: 0; height: 52px; background: var(--campo); border: 1px solid var(--borda);
    border-radius: 14px; color: var(--texto); padding: 0 14px; font: 13px var(--mono); outline: none;
  }
  input[type=url]::placeholder { color: #5E5E6A; }
  input[type=url]:focus { border-color: var(--acento); }
  .caixa { position: relative; flex: 1; min-width: 0; display: flex; }
  .caixa input[type=url] { padding-right: 46px; }
  .limpar { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px;
    border: 0; border-radius: 10px; background: var(--borda); color: var(--texto); cursor: pointer;
    display: flex; align-items: center; justify-content: center; }
  .limpar[hidden] { display: none; }
  .limpar:hover { background: #3A3A45; }
  .colar { height: 52px; padding: 0 16px; background: var(--campo); color: var(--acento);
    border: 1px solid var(--borda); border-radius: 14px; font: 700 14px 'Space Grotesk', sans-serif; cursor: pointer; }
  .colar:hover { border-color: var(--acento); }
  .opcoes input { position: absolute; opacity: 0; pointer-events: none; }
  .segmento { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--campo);
    border: 1px solid var(--borda); border-radius: 16px; padding: 5px; }
  .segmento label { height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    color: var(--apagado); font-weight: 500; cursor: pointer; transition: all .15s; user-select: none; }
  .segmento input:checked + label { background: var(--borda); color: var(--texto); font-weight: 700; }
  .cartoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cartoes label { height: 76px; border: 1px solid var(--borda); border-radius: 16px; background: var(--campo);
    color: var(--apagado); display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; cursor: pointer; transition: all .15s; user-select: none; }
  .cartoes svg { stroke: currentColor; }
  .cartoes input:checked + label { border: 1.5px solid var(--acento); color: var(--texto); font-weight: 700; }
  .cartoes input:checked + label svg { stroke: var(--acento); }
  .opcoes input:focus-visible + label { outline: 2px solid var(--acento); outline-offset: 2px; }
  .baixar { height: 60px; border: 0; border-radius: 18px; background: var(--acento); color: var(--bg);
    font: 700 18px 'Space Grotesk', sans-serif; letter-spacing: -.01em; cursor: pointer; transition: transform .1s, opacity .15s; }
  .baixar:active { transform: scale(.98); }
  .baixar:disabled { opacity: .6; cursor: wait; }
  .status { min-height: 1.5em; margin: -8px 0 0; text-align: center; font-size: 14px; color: var(--suave); }
  .status.erro { color: var(--erro); }
  .status.ok { color: var(--acento); }
  .spinner { display: inline-block; width: 1em; height: 1em; border: 2px solid currentColor;
    border-right-color: transparent; border-radius: 50%; animation: gira .7s linear infinite;
    vertical-align: -2px; margin-right: 6px; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .anuncio { position: fixed; inset: 0; z-index: 50; background: rgba(5, 5, 8, .88);
    display: flex; align-items: center; justify-content: center; padding: 16px;
    visibility: hidden; opacity: 0; transition: opacity .2s; }
  .anuncio.aberto { visibility: visible; opacity: 1; }
  .anuncio-caixa { position: relative; width: 100%; max-width: 360px; background: var(--campo);
    border: 1px solid var(--borda); border-radius: 20px; padding: 44px 14px 16px;
    display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .anuncio-rotulo { position: absolute; top: 14px; left: 16px; font: 11px var(--mono); color: var(--apagado);
    text-transform: uppercase; letter-spacing: .08em; }
  .anuncio-fechar { position: absolute; top: 8px; right: 8px; min-width: 44px; height: 32px; padding: 0 10px;
    border-radius: 10px; border: 1px solid var(--borda); background: var(--bg); color: var(--apagado);
    font: 600 13px var(--mono); cursor: not-allowed; display: flex; align-items: center; justify-content: center; }
  .anuncio-fechar.liberado { color: var(--texto); border-color: var(--acento); cursor: pointer; }
  .anuncio-espaco { width: 100%; min-height: 250px; display: flex; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center; overflow: hidden; }
  .anuncio-exemplo { width: 300px; max-width: 100%; height: 250px; border: 1.5px dashed var(--borda); border-radius: 12px;
    display: flex; align-items: center; justify-content: center; color: var(--apagado); font: 13px var(--mono); }
  .anuncio-progresso { font-size: 13px; color: var(--suave); text-align: center; }
  footer { margin-top: auto; text-align: center; font-size: 12px; color: #6C6C78; }
</style>
</head>
<body>
<main>
  <div class="topo">
    <div class="marca">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E0E12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12"/><path d="M6 11l6 6 6-6"/><path d="M5 20h14"/></svg>
      </div>
      PUXA
    </div>
    <span class="versao">v1.0</span>
  </div>

  <div>
    <h1>Cola o link.<br>A gente <span>puxa</span>.</h1>
    <p class="sub">Fotos e vídeos do Instagram e do Facebook, direto no seu aparelho.</p>
  </div>

  <form id="form">
    <div>
      <label class="rotulo" for="url">Link do post</label>
      <div class="campo">
        <div class="caixa">
          <input type="url" id="url" placeholder="https://instagram.com/p/…" required autocomplete="off">
          <button type="button" class="limpar" id="limpar" aria-label="Apagar link" hidden>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <button type="button" class="colar" id="colar">Colar</button>
      </div>
    </div>

    <div>
      <span class="rotulo">Rede</span>
      <div class="segmento opcoes">
        <input type="radio" name="plataforma" id="plat-insta" value="instagram" checked>
        <label for="plat-insta">Instagram</label>
        <input type="radio" name="plataforma" id="plat-face" value="facebook">
        <label for="plat-face">Facebook</label>
      </div>
    </div>

    <div>
      <span class="rotulo">Formato</span>
      <div class="cartoes opcoes">
        <input type="radio" name="tipo" id="tipo-img" value="imagem" checked>
        <label for="tipo-img">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
          Imagem
        </label>
        <input type="radio" name="tipo" id="tipo-vid" value="video">
        <label for="tipo-vid">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="15" height="14" rx="3"/><path d="M17 10l5-3v10l-5-3z"/></svg>
          Vídeo
        </label>
      </div>
    </div>

    <button class="baixar" id="botao" type="submit">Puxar arquivo</button>
    <p class="status" id="status" role="status"></p>
  </form>

  <footer>Baixe só conteúdo seu ou com permissão.</footer>
</main>

<div class="anuncio" id="anuncio" role="dialog" aria-modal="true" aria-label="Anúncio">
  <div class="anuncio-caixa">
    <span class="anuncio-rotulo">Anúncio</span>
    <button type="button" class="anuncio-fechar" id="anuncio-fechar" aria-label="Fechar anúncio" disabled>5</button>
    <div class="anuncio-espaco">
      {% if tem_anuncio %}{% include "anuncio.html" %}{% else %}<div class="anuncio-exemplo">Espaço do anúncio 300×250</div>{% endif %}
    </div>
    <p class="anuncio-progresso" id="anuncio-progresso">Preparando seu arquivo…</p>
  </div>
</div>

<script>
  const form = document.getElementById("form");
  const urlInput = document.getElementById("url");
  const botao = document.getElementById("botao");
  const status = document.getElementById("status");

  // ---------- Anúncio antes do download ----------
  // Aparece se houver código em anuncio.html, ou para teste com ?anuncio no endereço.
  const ANUNCIO_ATIVO = {{ 'true' if tem_anuncio else 'false' }} || new URLSearchParams(location.search).has("anuncio");
  const SEGUNDOS_ANUNCIO = 5;
  const caixaAnuncio = document.getElementById("anuncio");
  const fecharAnuncio = document.getElementById("anuncio-fechar");
  const progressoAnuncio = document.getElementById("anuncio-progresso");

  function exibirAnuncio() {
    if (!ANUNCIO_ATIVO) return Promise.resolve();
    return new Promise((resolver) => {
      let resta = SEGUNDOS_ANUNCIO;
      fecharAnuncio.disabled = true;
      fecharAnuncio.classList.remove("liberado");
      fecharAnuncio.textContent = resta;
      progressoAnuncio.textContent = "Preparando seu arquivo…";
      caixaAnuncio.classList.add("aberto");
      const relogio = setInterval(() => {
        resta -= 1;
        if (resta > 0) { fecharAnuncio.textContent = resta; return; }
        clearInterval(relogio);
        fecharAnuncio.disabled = false;
        fecharAnuncio.classList.add("liberado");
        fecharAnuncio.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
        fecharAnuncio.focus();
      }, 1000);
      fecharAnuncio.onclick = () => {
        if (fecharAnuncio.disabled) return;
        caixaAnuncio.classList.remove("aberto");
        resolver();
      };
    });
  }

  const limpar = document.getElementById("limpar");
  const atualizarLimpar = () => { limpar.hidden = !urlInput.value; };
  limpar.addEventListener("click", () => {
    urlInput.value = ""; atualizarLimpar(); mostrar(""); urlInput.focus();
  });

  // Detecta a rede e se é vídeo sozinho ao colar o link
  urlInput.addEventListener("input", () => {
    atualizarLimpar();
    const u = urlInput.value.toLowerCase();
    if (/instagram\.com|instagr\.am/.test(u)) document.getElementById("plat-insta").checked = true;
    else if (/facebook\.com|fb\.watch|fb\.com/.test(u)) document.getElementById("plat-face").checked = true;
    // Vídeo: reels, vídeos, watch, links de compartilhar reel/vídeo do Facebook
    if (/\/reels?\/|\/tv\/|\/videos?\/|fb\.watch|\/watch|\/share\/[rv]\//.test(u)) document.getElementById("tipo-vid").checked = true;
    // Foto: posts do Instagram (/p/), fotos e links de compartilhar post do Facebook
    else if (/instagram\.com\/(?:[\w.]+\/)?p\/|\/photos?[\/.?]|photo\.php|\/share\/p\//.test(u)) document.getElementById("tipo-img").checked = true;
  });

  document.getElementById("colar").addEventListener("click", async () => {
    try {
      urlInput.value = (await navigator.clipboard.readText()).trim();
      urlInput.dispatchEvent(new Event("input"));
    } catch { urlInput.focus(); }
  });

  function mostrar(msg, classe = "") { status.className = "status " + classe; status.innerHTML = msg; }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const dados = {
      url: urlInput.value.trim(),
      plataforma: document.querySelector('input[name="plataforma"]:checked').value,
      tipo: document.querySelector('input[name="tipo"]:checked').value,
    };
    botao.disabled = true;
    botao.textContent = "Puxando…";
    mostrar('<span class="spinner"></span>Isso pode levar alguns segundos');

    const anuncioFechado = exibirAnuncio();
    const controle = new AbortController();
    const limite = setTimeout(() => controle.abort(), 150000);
    const aviso = setTimeout(() => mostrar('<span class="spinner"></span>Ainda tentando… o servidor pode estar acordando'), 20000);
    try {
      const resp = await fetch("/baixar", {
        signal: controle.signal,
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados),
      });
      if (!resp.ok) {
        let msg = "Algo deu errado.";
        try { msg = (await resp.json()).erro || msg; } catch {}
        throw new Error(msg);
      }
      const blob = await resp.blob();
      progressoAnuncio.textContent = "Arquivo pronto! Feche o anúncio para baixar.";
      await anuncioFechado;
      const cd = resp.headers.get("Content-Disposition") || "";
      const m = cd.match(/filename\*=UTF-8''([^;]+)|filename="?([^";]+)"?/i);
      const nome = m ? decodeURIComponent(m[1] || m[2]) : "download";

      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = nome;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 10000);
      const tipoReal = resp.headers.get("X-Tipo");
      const trocou = tipoReal && tipoReal !== dados.tipo;
      if (trocou) document.getElementById(tipoReal === "video" ? "tipo-vid" : "tipo-img").checked = true;
      mostrar((trocou ? (tipoReal === "video" ? "Era um vídeo — baixado: " : "Era uma foto — baixada: ") : "Pronto: ") + nome, "ok");
      urlInput.value = ""; atualizarLimpar();  // limpa para o próximo link
    } catch (err) {
      progressoAnuncio.textContent = "Não deu certo. Feche para ver o motivo.";
      await anuncioFechado;
      mostrar(err.name === "AbortError" ? "Demorou demais. O Instagram/Facebook pode estar bloqueando o servidor — tente de novo." : err.message, "erro");
    } finally {
      clearTimeout(limite); clearTimeout(aviso);
      botao.disabled = false;
      botao.textContent = "Puxar arquivo";
    }
  });
</script>
</body>
</html>
